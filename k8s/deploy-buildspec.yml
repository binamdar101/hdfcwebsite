version: 0.2

phases:
  pre_build:
    commands:
      - echo "Configuring kubectl for EKS..."
      - aws eks update-kubeconfig --region us-east-1 --name hdfc-eks
      - kubectl get nodes

  build:
    commands:
      - echo "Deploying Kubernetes resources..."
      - kubectl apply -f k8s/namespace.yaml
      - kubectl apply -f k8s/hdfc-applications.yaml
      - kubectl apply -f k8s/ingress.yaml

  post_build:
    commands:
      - echo "Waiting for deployments..."
      - kubectl rollout status deployment/insurance-deployment -n hdfc --timeout=300s
      - kubectl rollout status deployment/internetbanking-deployment -n hdfc --timeout=300s
      - echo "Deployment completed successfully!"
      - kubectl get deployments -n hdfc
      - kubectl get pods -n hdfc
